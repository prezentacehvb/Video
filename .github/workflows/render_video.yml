name: Render HVB Video

on:
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write

concurrency:
  group: render-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade edge-tts  # <--- Aktualizace edge-tts na nejnovější verzi kvůli chybě 403

      - name: Install system dependencies (Fast & Reliable)
        run: |
          # 1. Oprava pomalého Azure zrcadla Ubuntu
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list || true
          sudo apt-get update
          
          # 2. Instalace fontů a ImageMagicku bez zbytečného balastu
          sudo apt-get install -y --no-install-recommends fonts-liberation imagemagick
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@*"/g' /etc/ImageMagick-6/policy.xml

          # 3. Stažení hotového statického FFmpeg (místo pomalého apt-get install ffmpeg)
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/

      - name: Write job payload
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$JOB_PAYLOAD" > job.json

      - name: Validate job payload
        run: python -c "import json; json.load(open('job.json', encoding='utf-8')); print('job.json OK')"

      - name: Render video
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python video.py job.json

      - name: Notify broker of failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notify.py --status failed --job job.json
        run: python notify.py --status failed --job job.json
