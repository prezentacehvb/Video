<script>
        function checkLogin() {
            const emailInput = document.getElementById('loginEmail');
            const email = emailInput.value.toLowerCase().trim();
            const notRobot = document.getElementById('notRobot').checked;
            const errorMsg = document.getElementById('loginError');

            if (email.endsWith('@hvbreal.cz') && notRobot) {
                errorMsg.style.display = 'none';
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainCard').classList.remove('blurred');
                const formEmail = document.getElementById('MAKLER_EMAIL');
                formEmail.value = email;
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // Pomocná funkce pro automatickou opravu "m2" na "m²"
        function fixM2(text) {
            return text.replace(/m2/gi, 'm²');
        }

        // Komprese a zmenšení fotky + kontrola orientace na šířku (změněno na 4K a 90% kvalitu)
        function processAndValidateImage(file, maxWidth = 3840, maxHeight = 2160, quality = 0.90) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        // Kontrola orientace na šířku (šířka musí být větší než výška)
                        if (height >= width) {
                            return reject(new Error(`HEIGHT_FILTER`));
                        }

                        if (width > maxWidth || height > maxHeight) {
                            if (width / height > maxWidth / maxHeight) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            } else {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        const base64Data = dataUrl.split(',')[1];
                        resolve({ name: file.name, base64: base64Data });
                    };
                    img.onerror = () => reject(new Error(`Chyba při načítání souboru ${file.name}`));
                };
                reader.onerror = () => reject(new Error(`Chyba při čtení souboru ${file.name}`));
            });
        }

        // Pomocná funkce pro zobrazení neobstrukční informativní zprávy
        function showInfoBanner(message) {
            let infoBox = document.getElementById("infoNoticeBox");
            if (!infoBox) {
                infoBox = document.createElement("div");
                infoBox.id = "infoNoticeBox";
                infoBox.style.cssText = "margin-top: 15px; padding: 12px; background: rgba(255, 193, 7, 0.15); border: 1px solid #ffc107; color: #ffeb3b; border-radius: 8px; font-size: 0.9rem; text-align: center;";
                const fileInput = document.getElementById("images");
                fileInput.parentNode.appendChild(infoBox);
            }
            infoBox.innerText = message;
            infoBox.style.display = "block";
        }

        async function sendData(event) {
            event.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;

            // Skrytí předchozího hlásiče, pokud existoval
            const prevNotice = document.getElementById("infoNoticeBox");
            if (prevNotice) prevNotice.style.display = "none";

            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJMZKSpl0SL5D0NO54E7GbBreUlFDamp0FT-rnUKdA1M0Vz-vzUigQrQ3y_902QxI9_w/exec";
            const fileInput = document.getElementById("images");
            const files = Array.from(fileInput.files);

            // Automatická oprava "m2" na "m²" v zadaných textech
            const rawTextTop = document.getElementById("TEXT_TOP").value;
            const rawTextBottom = document.getElementById("TEXT_BOTTOM").value;
            
            const textTopFixed = fixM2(rawTextTop);
            const textBottomFixed = fixM2(rawTextBottom);

            // Aktualizace hodnot v polích, aby to viděl i makléř na obrazovce
            document.getElementById("TEXT_TOP").value = textTopFixed;
            document.getElementById("TEXT_BOTTOM").value = textBottomFixed;

            let secondsElapsed = 0;
            
            const timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60);
                const secs = secondsElapsed % 60;
                const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                submitBtn.innerText = `Odesílám data ke zpracování... (${timeStr})`;
            }, 1000);

            submitBtn.innerText = `Odesílám data ke zpracování... (0:00)`;

            try {
                // Postupné zpracování a filtrace fotografií
                let convertedFiles = [];
                let removedDueToHeight = false;

                for (let i = 0; i < files.length; i++) {
                    try {
                        const processed = await processAndValidateImage(files[i]);
                        convertedFiles.push(processed);
                    } catch (err) {
                        if (err.message === 'HEIGHT_FILTER') {
                            removedDueToHeight = true;
                        } else {
                            throw err;
                        }
                    }
                }

                let removedDueToCount = false;
                if (convertedFiles.length > 15) {
                    convertedFiles = convertedFiles.slice(0, 15);
                    removedDueToCount = true;
                }

                // Informativní banner bez nutnosti klikat na alert modal
                if (removedDueToHeight || removedDueToCount) {
                    showInfoBanner("Informace: Některé fotografie přesahující povolený počet nebo orientované na výšku byly automaticky vyřazeny.");
                }

                if (convertedFiles.length === 0) {
                    alert("Žádná z vybraných fotografií nesplňuje požadavky (orientace na šířku).");
                    clearInterval(timerInterval);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "VYTVOŘIT VIDEO";
                    return;
                }

                const timeStamp = new Date().getTime();
                const randomPart = Math.random().toString(36).substring(2, 7);
                const clientJobId = "job_" + timeStamp + "_" + randomPart;

                const payload = {
                    CLIENT_JOB_ID: clientJobId,
                    MAKLER_JMENO: document.getElementById("MAKLER_JMENO").value,
                    MAKLER_EMAIL: document.getElementById("MAKLER_EMAIL").value,
                    MAKLER_TELEFON: document.getElementById("MAKLER_TELEFON").value,
                    TEXT_TOP: textTopFixed,
                    TEXT_BOTTOM: textBottomFixed,
                    images: convertedFiles
                };

                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(payload)
                });

                clearInterval(timerInterval);
                const sentTime = new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                alert(`Data odeslána v ${sentTime}`);
                document.getElementById("videoForm").reset();

            } catch (e) {
                clearInterval(timerInterval);
                console.error(e);
                alert("Chyba při zpracování fotografií: " + e.message);
            } finally {
                clearInterval(timerInterval);
                submitBtn.disabled = false;
                submitBtn.innerText = "VYTVOŘIT VIDEO";
            }
        }
    </script>
